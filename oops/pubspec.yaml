name: oops
description: "HireMe — Services at your doorstep"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.2.2
  flutter_dotenv: ^5.2.1

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  image_picker: ^1.2.3

  # Location Services (Phase 4.3.3)
  # flutter_map: OpenStreetMap tiles, no API key required
  flutter_map: ^7.0.2
  # latlong2: Lat/Lng coordinate type used by flutter_map
  latlong2: ^0.9.1
  # geolocator: GPS, permissions, location stream
  geolocator: ^13.0.2
  # geocoding: Reverse/forward geocoding using device geocoder
  geocoding: ^3.0.0
  socket_io_client: ^3.1.6
  url_launcher: ^6.3.2
  file_picker: ^11.0.3
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logos/
    - assets/images/onboarding/
    - assets/images/banners/
    - assets/images/profile/
    - assets/images/services/
    - assets/images/workers/
    - assets/lottie/
    - assets/icons/
    - assets/illustrations/
    - assets/animations/
    - .env.development
    - .env.staging
    - .env.production
    - .env.example
