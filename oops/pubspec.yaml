name: oops
description: "HireMe — Services at your doorstep"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.2.2
  flutter_dotenv: ^5.2.1

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logos/
    - assets/images/onboarding/
    - assets/images/banners/
    - assets/images/profile/
    - assets/images/services/
    - assets/images/workers/
    - assets/lottie/
    - assets/icons/
    - assets/illustrations/
    - assets/animations/
    - .env.development
    - .env.staging
    - .env.production
    - .env.example
